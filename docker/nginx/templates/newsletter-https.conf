log_format newsletter_safe '$remote_addr [$time_local] "$request_method $uri $server_protocol" $status $body_bytes_sent';
access_log /var/log/nginx/access.log newsletter_safe;
limit_req_zone $binary_remote_addr zone=newsletter_forms:10m rate=30r/m;

server {
    listen 80;
    server_name newsmail.spjinc.org;

    autoindex off;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/acme;
        default_type text/plain;
        try_files $uri =404;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    http2 on;
    server_name newsmail.spjinc.org;

    root /usr/share/nginx/html;
    index index.html;
    autoindex off;

    rewrite ^/heros/?(.*)$ /heroes/$1 permanent;
    rewrite ^/cnnheros/?(.*)$ /heroes/$1 permanent;
    rewrite ^/cnnheroes/?(.*)$ /heroes/$1 permanent;

    ssl_certificate /etc/nginx/tls/newsmail.spjinc.org/fullchain.pem;
    ssl_certificate_key /etc/nginx/tls/newsmail.spjinc.org/privkey.pem;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;

    client_max_body_size 10m;

    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto https;

    location = /unsub {
        proxy_pass http://web:8000;
    }

    location = /spj/unsub {
        proxy_pass http://web:8000;
    }

    location = /manage {
        proxy_pass http://web:8000;
    }

    location = /manage-newsletter {
        proxy_pass http://web:8000;
    }

    location = / {
        limit_req zone=newsletter_forms burst=20 nodelay;
        limit_req_status 429;
        proxy_pass http://web:8000;
    }

    location ~ ^/(privacy|subscribe|unsubscribe|confirm|request-saved)$ {
        limit_req zone=newsletter_forms burst=20 nodelay;
        limit_req_status 429;
        proxy_pass http://web:8000;
    }

    location ^~ /newsletter-assets/ {
        proxy_pass http://web:8000;
    }

    location = /heroes {
        return 301 /heroes/$is_args$args;
    }

    location / {
        try_files $uri $uri/ =404;
    }
}
