server {
    listen 80;
    server_name newsmail.spjinc.org;

    root /usr/share/nginx/html;
    index index.html;
    autoindex off;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/acme;
        default_type text/plain;
        try_files $uri =404;
    }

    location = / {
        try_files /index.html =404;
    }

    location = /cnnheros {
        return 301 /cnnheros/$is_args$args;
    }

    location / {
        try_files $uri $uri/ =404;
    }
}
