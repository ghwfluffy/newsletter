server {
    listen 80;
    server_name newsmail.spjinc.org;

    root /usr/share/nginx/html;
    index index.html;
    autoindex off;

    rewrite ^/heros/?(.*)$ /heroes/$1 permanent;
    rewrite ^/cnnheros/?(.*)$ /heroes/$1 permanent;
    rewrite ^/cnnheroes/?(.*)$ /heroes/$1 permanent;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/acme;
        default_type text/plain;
        try_files $uri =404;
    }

    location = / {
        try_files /index.html =404;
    }

    location = /heroes {
        return 301 /heroes/$is_args$args;
    }

    location / {
        try_files $uri $uri/ =404;
    }
}
